# ============================================================
# .github/workflows/drift-detect.yml
# Nightly drift detection — alerts if someone manually changed
# Azure or Databricks resources outside of Terraform
# ============================================================

name: Drift Detection

on:
#   schedule:
#     - cron: '0 6 * * *'   # Every day at 06:00 UTC
  workflow_dispatch:

env:
  ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  TF_VERSION:          "1.6.4"

jobs:
  drift_check:
    name: Drift Check / ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, staging, prod]

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          cd terraform/environments/${{ matrix.env }}
          terraform init

      - name: Terraform Plan (drift check)
        id: plan
        run: |
          cd terraform/environments/${{ matrix.env }}
          terraform plan \
            -detailed-exitcode \
            -var="subscription_id=${{ secrets.ARM_SUBSCRIPTION_ID }}" \
            -var="databricks_account_id=${{ secrets.DATABRICKS_ACCOUNT_ID }}" \
            2>&1 | tee /tmp/plan-output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Alert on drift
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Terraform Drift Detected — ${{ matrix.env }}`,
              body: `Drift was detected in the \`${{ matrix.env }}\` environment.\n\nThis means resources have been changed outside of Terraform.\n\nPlease review and reconcile.`,
              labels: ['drift', 'infrastructure']
            });
